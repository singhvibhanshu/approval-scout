name: ci

# Runs on PRs and, crucially, on the merge_group event so it can serve as the
# required check for the branch's merge queue.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
